apiVersion: apps/v1
kind: Deployment
metadata:
  name: ac-database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ac-database
  template:
    metadata:
      labels:
        app: ac-database
    spec:
      containers:
        - name: mysql
          image: "{{ .Values.mysql.image }}"
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: root-password
          volumeMounts:
            - name: ac-database
              mountPath: /var/lib/mysql
          securityContext:
            runAsGroup: 988
            runAsUser: 977
      volumes:
        - name: ac-database
          nfs:
            path: /var/nfs/shared/k8s/wow-ac-database
            server: 192.168.1.134
            